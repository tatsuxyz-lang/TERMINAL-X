<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL-X | COCKPIT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
    /* スマホで「今何が起きてるか」をデカく見せる */
    .mobile-gauge {
        display: block;
        width: 90%;
        margin: 10px auto;
        padding: 15px;
        background: #001100;
        border: 2px solid #00ff41;
    }
    .status-indicator {
        font-size: 2.5rem; /* デカい文字で状態を表示 */
        font-weight: bold;
        display: block;
    }
    .action-btn {
        width: 90%;
        padding: 20px; /* 指で押しやすい高さ */
        font-size: 1.2rem;
        margin: 10px 0;
    }
</style>

<div class="mobile-gauge">
    [ BUFFER STATUS ]
    <span class="status-indicator" id="indicator">EMPTY</span>
    <div id="packetLabel">READY TO CONNECT</div>
</div>
    
</head>
    
<body>
    <h1>TERMINAL-X COCKPIT</h1>

    <div class="dashboard">
        <div class="gauge-box">
            [ SYSTEM STATUS ]
            <span class="big-number">ONLINE</span>
            <div class="active-log" id="sysLog">
                > Initializing...<br>
                > Kernel loaded...<br>
                > Port 127.0.0.1 Open.
            </div>
        </div>

        <div class="gauge-box">
            [ LAST PACKET INFO ]
            <span id="packetSize" class="big-number">0000</span>
            <div class="active-log">
                <span id="packetType">> Waiting for data...</span>
            </div>
        </div>
    </div>

    <div class="box">
        <h3>MISSION SELECT</h3>
        <nav style="display: flex; justify-content: space-around; font-size: 0.9rem;">
            <a href="stegano_in.html" style="color:#0f0;">[凸 ENCODE]</a>
            <a href="stegano_out.html" style="color:#0f0;">[凹 DECODE]</a>
            <a href="mimamori.html" style="color:#0f0;">[MONITOR]</a>
        </nav>
    </div>

    <div class="box">
        <h3>DATA BUFFER (LocalStorage)</h3>
        <textarea id="packetPreview" readonly style="width: 95%; height: 80px; font-size: 0.7rem;"></textarea>
        <br><br>
        <button onclick="copyToClip('packetPreview')">COPY BUFFER</button>
        <button onclick="clearBuffer()" style="background:#800; color:#fff;">CLEAR</button>
    </div>

    <script src="js/base.js"></script>
    <script>
        function updateDashboard() {
            const data = localStorage.getItem('last_packet') || "";
            document.getElementById('packetPreview').value = data;
            document.getElementById('packetSize').innerText = data.length.toString().padStart(4, '0');
            
            if(data.startsWith("STG")) {
                document.getElementById('packetType').innerText = "> Steganography detected.";
            } else if(data !== "") {
                document.getElementById('packetType').innerText = "> Raw data packet.";
            }
        }

        function clearBuffer() {
            if(confirm("DELETE ALL DATA?")) {
                localStorage.removeItem('last_packet');
                location.reload();
            }
        }
        window.onload = updateDashboard;
    </script>
</body>
</html>
